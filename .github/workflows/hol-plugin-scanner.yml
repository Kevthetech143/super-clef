name: HOL Plugin Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@1fb7eef6f7387abd0512e91ee8f336ac8bf07c95 # v1.2.789
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          trust_repository_policy: true
          min_score: 80
          fail_on_severity: high
