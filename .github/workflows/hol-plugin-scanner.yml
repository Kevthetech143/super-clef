name: HOL Plugin Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@a4705d710505d3e8f6d639b683a0c87dd31ce598 # v1.2.748
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          trust_repository_policy: true
          min_score: 80
          fail_on_severity: high
